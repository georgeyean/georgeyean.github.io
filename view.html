<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8" />
	<title>George Yean | Papers</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
	<meta name="description" content="Swipe through George Yean's research papers." />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700|Raleway:700,800,900" rel="stylesheet">
	<style>
		:root {
			--accent: #8fa3b8;
			--accent-strong: #6b7b8c;
			--ink: #1c2126;

			/* Theme tokens — dark is the default look, unchanged from before. */
			--body-bg: #000;
			--body-bg-wide: #0a0c0e;
			--text-strong: #fff;
			--text: rgba(255,255,255,0.94);
			--text-muted: rgba(255,255,255,0.82);
			--text-dim: rgba(255,255,255,0.75);
			--text-faint: rgba(255,255,255,0.5);
			--text-fainter: rgba(255,255,255,0.45);
			--slide-overlay: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 35%, rgba(0,0,0,0.65) 100%);
			--topbar-bg: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.28) 65%, transparent 100%);
			--chip-bg: rgba(255,255,255,0.12);
			--chip-bg-strong: rgba(255,255,255,0.14);
			--chip-border: rgba(255,255,255,0.35);
			--scrollbar-thumb: rgba(255,255,255,0.35);
			--btn-primary-bg: #fff;
			--btn-primary-text: var(--ink);
			--btn-ghost-bg: rgba(255,255,255,0.14);
			--btn-ghost-border: rgba(255,255,255,0.35);
			--dot-bg: rgba(255,255,255,0.35);
			--dot-active: #fff;
			--track-line: rgba(255,255,255,0.7);
			--loading-bg: #14171b;
			--loading-text: rgba(255,255,255,0.75);
			--spinner-track: rgba(255,255,255,0.2);
			--spinner-top: #fff;
			--toggle-bg: rgba(255,255,255,0.14);
			--toggle-border: rgba(255,255,255,0.35);
			--select-chevron: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E');

			/* Pin native UI (scrollbars, the group dropdown's own popup,
			   iOS status-bar tinting) to whichever theme we've actually
			   chosen, so the OS's own light/dark setting can't reassert
			   itself independently of our toggle mid-scroll. */
			color-scheme: dark;
		}

		:root[data-theme="light"] {
			--body-bg: #ece7de;
			--body-bg-wide: #e4ddd1;
			--text-strong: #201d18;
			--text: rgba(32,29,24,0.92);
			--text-muted: rgba(32,29,24,0.78);
			--text-dim: rgba(32,29,24,0.7);
			--text-faint: rgba(32,29,24,0.5);
			--text-fainter: rgba(32,29,24,0.45);
			--slide-overlay: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 35%, rgba(255,255,255,0.55) 100%);
			--topbar-bg: linear-gradient(180deg, rgba(236,231,222,0.85) 0%, rgba(236,231,222,0.5) 65%, transparent 100%);
			--chip-bg: rgba(32,29,24,0.08);
			--chip-bg-strong: rgba(32,29,24,0.08);
			--chip-border: rgba(32,29,24,0.25);
			--scrollbar-thumb: rgba(32,29,24,0.3);
			--btn-primary-bg: #201d18;
			--btn-primary-text: #fff;
			--btn-ghost-bg: rgba(32,29,24,0.07);
			--btn-ghost-border: rgba(32,29,24,0.25);
			--dot-bg: rgba(32,29,24,0.25);
			--dot-active: #201d18;
			--track-line: rgba(32,29,24,0.55);
			--loading-bg: #ece7de;
			--loading-text: rgba(32,29,24,0.75);
			--spinner-track: rgba(32,29,24,0.18);
			--spinner-top: #201d18;
			--toggle-bg: rgba(32,29,24,0.08);
			--toggle-border: rgba(32,29,24,0.25);
			--select-chevron: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23201d18%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E');
			color-scheme: light;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: var(--body-bg);
			font-family: "Source Sans Pro", Helvetica, sans-serif;
			overscroll-behavior-y: none;
			transition: background 0.25s ease;
		}

		/* ── Feed: one full-screen snap section per paper ─────────────── */

		#feed {
			height: 100dvh;
			overflow-y: scroll;
			scroll-snap-type: y mandatory;
			scroll-behavior: smooth;
			-webkit-overflow-scrolling: touch;
		}

		.slide {
			position: relative;
			height: 100dvh;
			scroll-snap-align: start;
			scroll-snap-stop: always;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			color: var(--text-strong);
			padding: calc(6rem + env(safe-area-inset-top)) 1.5rem calc(1.75rem + env(safe-area-inset-bottom)) 1.5rem;
		}

		.content {
			flex: 1 1 auto;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}

		.slide::before {
			content: "";
			position: absolute;
			inset: 0;
			background: var(--bg-dark, linear-gradient(160deg, #3d4a58, #1c2126));
			z-index: 0;
		}

		:root[data-theme="light"] .slide::before {
			background: var(--bg-light, linear-gradient(160deg, #dfe6ec, #cdd8e0));
		}

		.slide::after {
			content: "";
			position: absolute;
			inset: 0;
			background: var(--slide-overlay);
			z-index: 1;
		}

		.slide > * {
			position: relative;
			z-index: 2;
		}

		/* ── Top bar: fixed once over the whole feed (site identity, Group
		   picker top-left, live counter top-right) — not re-rendered per
		   slide, since that would mean 1000+ duplicate dropdowns ────────── */

		.topbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 20;
			padding: calc(1rem + env(safe-area-inset-top)) 1.5rem 0.85rem 1.5rem;
			background: var(--topbar-bg);
			font-family: "Raleway", Helvetica, sans-serif;
			pointer-events: none;
		}

		.topbar > * { pointer-events: auto; }

		.topbar-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75em;
		}

		.topbar-row + .topbar-row { margin-top: 0.6em; }

		.home-link {
			color: var(--text-strong);
			text-decoration: none;
			font-weight: 800;
			font-size: 0.95rem;
			letter-spacing: 0.02em;
			opacity: 0.92;
			display: flex;
			align-items: center;
			gap: 0.5em;
			white-space: nowrap;
		}

		.home-link svg { width: 1.1em; height: 1.1em; opacity: 0.85; }

		.counter {
			font-size: 0.78rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			color: var(--text-dim);
			background: var(--chip-bg);
			padding: 0.3em 0.7em;
			border-radius: 999px;
			backdrop-filter: blur(6px);
			white-space: nowrap;
		}

		.theme-toggle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 2.1em;
			height: 2.1em;
			border-radius: 50%;
			background: var(--toggle-bg);
			border: 1px solid var(--toggle-border);
			color: var(--text-strong);
			backdrop-filter: blur(6px);
			cursor: pointer;
			flex: 0 0 auto;
		}

		.theme-toggle svg { width: 1.05em; height: 1.05em; }

		.topbar-right {
			display: flex;
			align-items: center;
			gap: 0.5em;
		}

		.group-select {
			appearance: none;
			-webkit-appearance: none;
			max-width: 100%;
			font-family: "Raleway", Helvetica, sans-serif;
			font-weight: 700;
			font-size: 0.72rem;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			color: var(--text-strong);
			background-color: var(--chip-bg-strong);
			background-image: var(--select-chevron);
			background-repeat: no-repeat;
			background-position: right 0.6em center;
			background-size: 0.7em;
			border: 1px solid var(--chip-border);
			border-radius: 999px;
			padding: 0.4em 1.9em 0.4em 0.9em;
			backdrop-filter: blur(6px);
		}

		.group-select:focus { outline: 2px solid var(--chip-border); outline-offset: 1px; }

		.group-select option { color: #111; background: #fff; }

		/* ── Card content ──────────────────────────────────────────────── */

		.kicker {
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: var(--accent);
			margin: 0 0 0.6em 0;
		}

		h1.title {
			font-family: "Raleway", Helvetica, sans-serif;
			font-weight: 900;
			font-size: 1.55rem;
			line-height: 1.28;
			margin: 0 0 0.4em 0;
			text-wrap: balance;
		}

		p.subtitle {
			font-family: "Raleway", Helvetica, sans-serif;
			font-weight: 400;
			font-size: 0.95rem;
			line-height: 1.5;
			color: var(--text-muted);
			margin: 0 0 0.15em 0;
		}

		p.journal {
			font-family: "Raleway", Helvetica, sans-serif;
			font-weight: 400;
			font-style: italic;
			font-size: 0.82rem;
			line-height: 1.4;
			color: var(--accent);
			margin: 0 0 1em 0;
		}

		.abstract-wrap {
			flex: 1 1 auto;
			min-height: 0;
			overflow: hidden;
			margin-bottom: 0.9em;
			/* The abstract box's own scrollbar sits at its right edge, which
			   (at the slide's normal 1.5rem padding) lands inside the
			   progress track's footprint on narrower screens — pull it in
			   further so the two don't crowd each other. Only the abstract
			   is narrowed; title/buttons/etc. keep the slide's normal width. */
			margin-right: 1rem;
		}

		.abstract {
			height: 100%;
			overflow-y: auto;
			overscroll-behavior: contain;
			/* A nested scrollable box inside another element that also uses
			   -webkit-overflow-scrolling: touch (here, #feed) needs this set
			   on itself too, or WebKit can hand a touch-drag gesture inside
			   it to the outer snap-scroll container instead of scrolling
			   this box's own content. */
			-webkit-overflow-scrolling: touch;
			touch-action: pan-y;
			padding-right: 0.4rem;
			font-size: 1.02rem;
			line-height: 1.62;
			color: var(--text);
		}

		.abstract-empty {
			font-style: italic;
			color: var(--text-faint);
		}

		.provenance {
			display: block;
			margin-top: 0.9em;
			font-size: 0.78rem;
			font-style: italic;
			color: var(--text-fainter);
		}

		.abstract::-webkit-scrollbar { width: 3px; }
		.abstract::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

		.actions {
			display: flex;
			align-items: center;
			gap: 0.6em;
			flex-wrap: wrap;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			gap: 0.5em;
			padding: 0.65em 1.1em;
			border-radius: 999px;
			font-family: "Raleway", Helvetica, sans-serif;
			font-weight: 700;
			font-size: 0.78rem;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			text-decoration: none;
			white-space: nowrap;
		}

		.btn-primary {
			background: var(--btn-primary-bg);
			color: var(--btn-primary-text);
		}

		.btn-ghost {
			background: var(--btn-ghost-bg);
			color: var(--text-strong);
			border: 1px solid var(--btn-ghost-border);
			backdrop-filter: blur(6px);
		}

		.btn svg { width: 1em; height: 1em; }

		/* ── Right-edge progress track: a single proportional scrubber
		   instead of one dot per paper — clicking/tapping anywhere along
		   it jumps to that fraction of the current (possibly filtered)
		   list, and the thumb's position always reflects current-paper /
		   total, so it stays meaningful whether there are 4 papers or
		   1,238. ─────────────────────────────────────────────────────── */

		.progress-track {
			position: fixed;
			right: 0.5rem;
			top: 12vh;
			bottom: 12vh;
			width: 28px;
			z-index: 5;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
			touch-action: none;
		}

		.progress-track::before {
			content: "";
			position: absolute;
			left: 50%;
			top: 0;
			bottom: 0;
			width: 3px;
			transform: translateX(-50%);
			/* A translucent line (like --dot-bg elsewhere) was too faint to
			   see at all on an e-ink screen's lower-contrast rendering —
			   this needs to be solidly visible on a wider range of
			   displays, not just LCD/OLED. */
			background: var(--track-line);
			border-radius: 1.5px;
		}

		.progress-thumb {
			position: absolute;
			left: 50%;
			top: 0%;
			width: 8px;
			height: 24px;
			border-radius: 4px;
			background: var(--dot-active);
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		/* ── First-run swipe hint ─────────────────────────────────────── */

		.swipe-hint {
			position: absolute;
			left: 50%;
			bottom: calc(1.1rem + env(safe-area-inset-bottom));
			transform: translateX(-50%);
			z-index: 3;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.15rem;
			font-family: "Raleway", Helvetica, sans-serif;
			font-size: 0.68rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: var(--text-dim);
			animation: hintBob 1.6s ease-in-out infinite;
			transition: opacity 0.4s ease;
		}

		/* Without this, the inline SVG has no intrinsic size and renders at
		   the browser's default (huge) fallback dimensions instead of a
		   small icon. */
		.swipe-hint svg {
			width: 1.4em;
			height: 1.4em;
			pointer-events: none;
		}

		.swipe-hint.hidden { opacity: 0; }

		@keyframes hintBob {
			0%, 100% { transform: translateX(-50%) translateY(0); }
			50% { transform: translateX(-50%) translateY(-6px); }
		}

		/* ~600px catches genuine 7"+ tablets/e-readers (which typically report
		   a CSS width in the 600-650px range in portrait), not just iPads and
		   up — the previous 720px cutoff missed them, leaving the smaller
		   phone-tuned font size on a screen plenty big enough for more. */
		@media (min-width: 600px) {
			#feed { max-width: 480px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.4); }
			body { background: var(--body-bg-wide); }
			.abstract { font-size: 1.18rem; }
		}

		/* ── Loading state ─────────────────────────────────────────────── */

		#loading {
			position: fixed;
			inset: 0;
			z-index: 30;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1rem;
			background: var(--loading-bg);
			color: var(--loading-text);
			font-family: "Raleway", Helvetica, sans-serif;
			font-size: 0.85rem;
			letter-spacing: 0.04em;
		}

		.spinner {
			width: 28px;
			height: 28px;
			border-radius: 50%;
			border: 2.5px solid var(--spinner-track);
			border-top-color: var(--spinner-top);
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}
	</style>
</head>
<body>

	<header class="topbar">
		<div class="topbar-row">
			<a href="index.html" class="home-link" id="homeLink">George Yean</a>
			<div class="topbar-right">
				<span class="counter" id="counter">1 / 1</span>
				<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode"></button>
			</div>
		</div>
		<div class="topbar-row">
			<select class="group-select" id="groupSelect" aria-label="Group">
				<option value="">All groups</option>
			</select>
		</div>
	</header>

	<div id="feed" tabindex="-1" style="outline: none;"></div>

	<div class="progress-track" id="progressTrack" role="slider" aria-label="Jump to paper" aria-valuemin="1">
		<div class="progress-thumb" id="progressThumb"></div>
	</div>

	<div id="loading">
		<div class="spinner"></div>
		<p>Loading your library…</p>
	</div>

	<script>
		// ─────────────────────────────────────────────────────────────────
		// Papers load from papers.json — a static export of georgeyean's
		// public Zotero library (every top-level/"first level" collection,
		// each collection's own top-level items only, filtered to items
		// with an abstract). Generated by scripts/export_zotero.py; re-run
		// that script whenever the Zotero library changes. Loading a local
		// JSON file instead of hitting Zotero's API live means a visitor's
		// page load costs one small same-origin request, not ~20 API calls.
		// ─────────────────────────────────────────────────────────────────
		const BG_PALETTE_DARK = [
			"linear-gradient(160deg, #4a3f52, #1c1a22)",
			"linear-gradient(160deg, #3d4a58, #1a2026)",
			"linear-gradient(160deg, #3d5250, #1a2422)",
			"linear-gradient(160deg, #52493d, #24201a)",
			"linear-gradient(160deg, #3d4552, #1a1e26)",
			"linear-gradient(160deg, #4f3d52, #221a24)"
		];
		// Same hue families as BG_PALETTE_DARK, lightened for day mode — kept
		// in step (same index order) so toggling theme never reshuffles which
		// card gets which hue.
		const BG_PALETTE_LIGHT = [
			"linear-gradient(160deg, #f2e8f5, #e6d9ea)",
			"linear-gradient(160deg, #e6edf3, #d8e2ea)",
			"linear-gradient(160deg, #e2eeec, #d3e3e0)",
			"linear-gradient(160deg, #f3ede1, #e8dfcd)",
			"linear-gradient(160deg, #e4e8f0, #d6dce8)",
			"linear-gradient(160deg, #f0e6ee, #e5d7e3)"
		];

		async function loadPapers() {
			const res = await fetch("papers.json");
			if (!res.ok) throw new Error(`papers.json fetch failed: ${res.status}`);
			const papers = await res.json();
			return papers.map((paper, i) => ({
				...paper,
				bgDark: BG_PALETTE_DARK[i % BG_PALETTE_DARK.length],
				bgLight: BG_PALETTE_LIGHT[i % BG_PALETTE_LIGHT.length]
			}));
		}

		// Static fallback, used only if papers.json fails to load (e.g. opening
		// this file directly from disk without a server, or before the export
		// script has been run for the first time).
		const FALLBACK_PAPERS = [
			{
				title: "Globalization Origins of Autocratic Rise",
				subtitle: "Engaged Reformers, Autocratic Advantages, and the Post-Cold War Reversal",
				abstract: "Conventional wisdom holds that globalization promotes political liberalization and that inclusive institutions favor growth. Yet after 1990, many autocracies not only consolidated but also outperformed comparable democracies economically, especially in trade. This article argues that globalization shifted the payoff structure of development in a way that advantages a specific authoritarian regime—economically engaged and reformed autocracies—in external demand competition, despite their weak internal demand. Autocratic institutional features, conventionally viewed as liabilities in closed economies—centralized authority or weak accountability—can become advantages under engagement-and-reform configurations. Specifically, trade integration and domestic reform jointly supply credibility for global market participation; on that basis, autocratic features become less costly levers for amplifying export competitiveness. This demand-competing advantage substitutes for politically inclusive institutions. Empirically, I connect macro-level patterns to micro-level mechanisms, showing how autocratic engaged reformers—accounting for over 90 percent of autocracies’ output and extending beyond China and oil states—outperformed in exports among broader economic outcomes. The findings reveal how globalization, interacting with domestic institutions, alters the institutional logic of competitive advantage, while exposing the limits of authoritarianism alone.",
				link: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7273119",
				bgDark: "linear-gradient(160deg, #4a3f52, #1c1a22)",
				bgLight: "linear-gradient(160deg, #f2e8f5, #e6d9ea)",
				group: "Research paper"
			},
			{
				title: "After Equilibrium",
				subtitle: "Expectation Mismatch, Real Deindustrialization, and the Roots of Anti-globalization Politics",
				abstract: "Why has free trade become harder to sustain in its maturity than in its rise? Prevailing accounts locate trade backlash primarily among liberalization’s losers. Yet backlash intensified long after those losses were absorbed, increasingly driven by policymakers across parties rather than by constituent pressure. I argue that the cause is top-down, and that support for openness rests on a promise that trade would reward one’s comparative strengths. Comparative advantage, however, is a claim about where liberalization settles, not whether that settlement endures. As globalization matures, foreign upgrading, technology diffusion, and state-backed distortions all erode incumbent advantage sectors, producing an expectation mismatch: trade no longer reads as a bargain that legitimated openness and adjustment costs, and elites begin to reinterpret it as unfair, producing real deindustrialization, and politically unsustainable. I test this theory in the context of U.S. trade politics through rich evidence from congressional speeches (1981-2024), the 2018 Section 301 action as the unprecedented trade policy reversal since WWII, and the U.S.-Japan and U.S.-China trade conflict cases. The findings show that protection concentrating in incumbent advantage sectors facing imminent competitive threat, broadening as the threat turns systemic. Contemporary anti-globalization is not the politics of displaced losers, but of threatened winners eroding the political sustainability of the openness bargain.",
				link: "files/equi.pdf",

			{

				subtitle: "An Issue-based Theory of Conditional Resilience",
				abstract: "When do aggrieved states seek change within an international order, and when do they instead contest it deeply, such as by backing a challenger? I argue that the answer depends on the character of the issue in dispute and the credibility of the outside option. When disengagement from a densely institutionalized order is costly, it takes more than ordinary grievances; it requires a breakdown of leaders’ loyalty to the order. Discontent therefore tends to escalate only through what I term helpless issues: those that are severe, persistent, attributable to the order, and resistant to reform from within. However, support for a challenger is dampened when the challenger is itself implicated in the underlying issue. Employing a mixed-methods approach, I test the theory in the case of the Liberal International Order (LIO) and U.S.–China competition, focusing on an highly contested issue of global imbalances. I show that support for Chinese leadership remains flat until grievances cross a sharp threshold and concentrates among helpless issues. Moreover, persistent current-account imbalances increase support, while China’s implication, proxied by bilateral trade imbalances, dampens the effect. Cross-domain evidence, alongside leaders’ rhetoric and qualitative cases, provides consistent support. The findings suggest conditional resilience of an order and show how issues—the source of contestation—shape globalization backlash, order durability, and renewed great-power politics.",
				link: "files/gi.pdf",

			{
				title: "Observational Equivalence of LLM and Human Annotation",
				subtitle: "with Kentaro Nakamura and Jing Ling Tan",
				abstract: "In this paper, we show that LLM and human coding are observationally equivalent in annotation quality: recent LLMs agree with expert coders at rates comparable to the agreement observed among experts themselves. We demonstrate this through replications of text-classification tasks from 14 peer-reviewed political science studies, in which ten LLMs, three human experts, and 165 crowd-sourced workers independently classify the same texts using identical codebooks. We find that this equivalence arises because of ambiguities in texts and coding rule. When LLMs disagree with experts, experts are also more likely to disagree with one another, and clarifying coding rules reduces disagreement among both experts and sufficiently capable LLMs. Thus, there is little empirical basis for preferring human coding on annotation quality alone, while LLMs offer substantial advantages in speed and cost. We therefore argue that the central challenge of text annotation is no longer choosing between human and machine coders, but developing coding rules that minimize ambiguity and accounting for the ambiguity that remains. To this end, we propose using disagreement across LLMs to identify difficult cases and refine codebooks, and develop ambiguity-aware bounds for downstream inference when a unique annotation cannot be defined for every text.",

		];

		const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>';
		const homeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>';
		const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>';
		const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>';
		const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></svg>';

		if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

		const feed = document.getElementById('feed');
		const progressTrack = document.getElementById('progressTrack');
		const progressThumb = document.getElementById('progressThumb');
		const loading = document.getElementById('loading');
		const counter = document.getElementById('counter');
		const groupSelect = document.getElementById('groupSelect');
		const homeLink = document.getElementById('homeLink');
		const themeToggle = document.getElementById('themeToggle');
		homeLink.innerHTML = `${homeIcon} George Yean`;

		// ── Theme toggle: dark by default, persisted per-browser in localStorage.
		// localStorage can throw (private browsing, blocked site data) — never
		// let a storage failure break rendering, just fall back to in-memory.
		function getStoredTheme() {
			try { return localStorage.getItem('theme'); } catch (err) { return null; }
		}
		function setStoredTheme(theme) {
			try { localStorage.setItem('theme', theme); } catch (err) { /* ignore */ }
		}
		function applyTheme(theme) {
			document.documentElement.setAttribute('data-theme', theme);
			themeToggle.innerHTML = theme === 'light' ? moonIcon : sunIcon;
			themeToggle.setAttribute('aria-label', theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
		}
		let currentTheme = getStoredTheme() === 'light' ? 'light' : 'dark';
		applyTheme(currentTheme);
		themeToggle.addEventListener('click', () => {
			currentTheme = currentTheme === 'light' ? 'dark' : 'light';
			applyTheme(currentTheme);
			setStoredTheme(currentTheme);
			// Give focus back to the feed so it (not this fixed, non-scrolling
			// button) is what a hardware up/down button or arrow key acts on.
			reclaimFeedFocus();
		});

		let ALL_PAPERS = [];
		let currentSlides = [];
		let observer = null;

		// Positions the single progress-track thumb proportionally: idx/total
		// down the line, so it stays meaningful whether the current
		// (possibly group-filtered) list has 4 papers or 1,238.
		function updateThumb(idx, total) {
			if (!total) return;
			const proportion = total > 1 ? idx / (total - 1) : 0;
			progressThumb.style.top = `${proportion * 100}%`;
			progressTrack.setAttribute('aria-valuenow', String(idx + 1));
			progressTrack.setAttribute('aria-valuemax', String(total));
		}

		// Click or drag anywhere on the track jumps straight to that
		// fraction of the current list — e.g. clicking 30% down jumps to
		// roughly the 30th percentile paper, not just the nearest dot.
		function jumpToTrackProportion(clientY) {
			if (!currentSlides.length) return;
			const rect = progressTrack.getBoundingClientRect();
			const proportion = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
			const idx = Math.round(proportion * (currentSlides.length - 1));
			// #feed has `scroll-behavior: smooth` in CSS for arrow-key/dot
			// navigation, but that also smooth-animates scrollIntoView calls
			// regardless of the behavior option passed here — across
			// hundreds of slides that reads as a slow crawl, not a jump.
			// Force instant scrolling just for this interaction.
			feed.style.scrollBehavior = 'auto';
			currentSlides[idx].scrollIntoView({ block: 'start' });
		}

		let trackDragging = false;
		let trackDragSafetyTimer = null;
		progressTrack.addEventListener('pointerdown', (e) => {
			trackDragging = true;
			// Pointer capture keeps drag-scrubbing working even if the
			// pointer moves off the (narrow) track; failing to set it just
			// means drag won't track outside the track, not a broken jump.
			try { progressTrack.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
			jumpToTrackProportion(e.clientY);
			// Last-resort self-heal: if nothing ever tells us the interaction
			// ended (see stopTrackDrag's comment below), force it closed after
			// a few seconds rather than staying stuck for the rest of the
			// session. Generous enough not to cut off a real, deliberate drag.
			clearTimeout(trackDragSafetyTimer);
			trackDragSafetyTimer = setTimeout(() => stopTrackDrag(), 4000);
		});
		progressTrack.addEventListener('pointermove', (e) => {
			if (trackDragging) jumpToTrackProportion(e.clientY);
		});
		function stopTrackDrag(e) {
			clearTimeout(trackDragSafetyTimer);
			if (!trackDragging) return; // already cleaned up — avoid redundant focus() calls
			trackDragging = false;
			feed.style.scrollBehavior = ''; // restore CSS smooth scrolling for arrow keys etc.
			try {
				if (e && e.pointerId != null && progressTrack.hasPointerCapture(e.pointerId)) {
					progressTrack.releasePointerCapture(e.pointerId);
				}
			} catch (err) { /* ignore */ }
			reclaimFeedFocus();
		}
		progressTrack.addEventListener('pointerup', stopTrackDrag);
		progressTrack.addEventListener('pointercancel', stopTrackDrag);
		// Some touchscreens/e-ink digitizers don't reliably fire pointerup
		// after a quick tap, which would leave pointer capture stuck on the
		// track and swallow later pointer-type input indefinitely (which is
		// how some e-reader hardware page-turn buttons are implemented under
		// the hood, even though they look like "keyboard" input at the OS
		// level) — 'lostpointercapture' fires whenever capture ends for any
		// reason, and a window-level fallback catches cases where even that
		// doesn't fire on the track itself.
		progressTrack.addEventListener('lostpointercapture', stopTrackDrag);
		window.addEventListener('pointerup', stopTrackDrag);
		window.addEventListener('pointercancel', stopTrackDrag);

		// A nested scrollable element inside #feed's own scroll-snap
		// container isn't reliably touch-scrollable via CSS alone on some
		// browser engines — the outer snap-scroll grabs the gesture before
		// it reaches the inner box. Drive the abstract's own scroll
		// manually from pointer events instead, but only while it actually
		// has room to move in the dragged direction; once at a boundary,
		// back off and let the outer feed's native swipe take over, so
		// swipe-to-next-paper still works naturally from on top of the text.
		function setupAbstractDrag(abstractEl) {
			if (!abstractEl) return;
			let dragging = false;
			let startY = 0;
			let startScrollTop = 0;
			let capturedId = null;

			abstractEl.addEventListener('pointerdown', (e) => {
				dragging = true;
				startY = e.clientY;
				startScrollTop = abstractEl.scrollTop;
			});

			abstractEl.addEventListener('pointermove', (e) => {
				if (!dragging) return;
				const deltaY = e.clientY - startY;
				const maxScroll = abstractEl.scrollHeight - abstractEl.clientHeight;
				const atTopAndPullingDown = abstractEl.scrollTop <= 0 && deltaY > 0;
				const atBottomAndPullingUp = abstractEl.scrollTop >= maxScroll && deltaY < 0;
				if (atTopAndPullingDown || atBottomAndPullingUp) return; // let the outer feed handle it
				abstractEl.scrollTop = Math.max(0, Math.min(maxScroll, startScrollTop - deltaY));
				if (e.cancelable) e.preventDefault();
				e.stopPropagation();
				if (capturedId === null) {
					capturedId = e.pointerId;
					try { abstractEl.setPointerCapture(capturedId); } catch (err) { /* ignore */ }
				}
			}, { passive: false });

			function stopAbstractDrag(e) {
				dragging = false;
				if (capturedId !== null) {
					try { if (abstractEl.hasPointerCapture(capturedId)) abstractEl.releasePointerCapture(capturedId); } catch (err) { /* ignore */ }
					capturedId = null;
				}
			}
			abstractEl.addEventListener('pointerup', stopAbstractDrag);
			abstractEl.addEventListener('pointercancel', stopAbstractDrag);
		}

		function renderFeed(papers) {
			if (observer) observer.disconnect();
			feed.innerHTML = '';

			papers.forEach((paper, i) => {
				const slide = document.createElement('section');
				slide.className = 'slide';
				slide.style.setProperty('--bg-dark', paper.bgDark);
				slide.style.setProperty('--bg-light', paper.bgLight);

				slide.innerHTML = `
					<div class="content">
						<div class="kicker">${paper.group || "Research paper"}</div>
						<h1 class="title">${paper.title}</h1>
						${paper.subtitle ? `<p class="subtitle">${paper.subtitle}</p>` : ''}
						${paper.journal ? `<p class="journal">${paper.journal}</p>` : ''}
						<div class="abstract-wrap">
						<div class="abstract${paper.abstract ? '' : ' abstract-empty'}">${paper.abstract || 'No abstract available for this item.'}${paper.source === 'pdf' ? `<span class="provenance">Extracted from the PDF's own text — not in Zotero's metadata.</span>` : ''}${paper.source === 'web' ? `<span class="provenance">Summarized from web search results — not the paper's original abstract.</span>` : ''}</div>
					</div>
						<div class="actions">
							${paper.link ? `<a class="btn btn-primary" href="${paper.link}" target="_blank" rel="noopener">${linkIcon} Read paper</a>` : `<span class="btn btn-ghost" style="opacity:0.6;">Draft — link coming soon</span>`}
						</div>
					</div>
					${i === 0 ? `<div class="swipe-hint" id="swipeHint">${chevronIcon}<span>Swipe</span></div>` : ''}
				`;
				feed.appendChild(slide);
				setupAbstractDrag(slide.querySelector('.abstract'));
			});

			feed.scrollTop = 0;
			currentSlides = Array.from(feed.querySelectorAll('.slide'));
			counter.textContent = `${papers.length ? 1 : 0} / ${papers.length}`;
			progressTrack.setAttribute('aria-valuemax', String(papers.length));
			updateThumb(0, papers.length);

			observer = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						const idx = currentSlides.indexOf(entry.target);
						counter.textContent = `${idx + 1} / ${papers.length}`;
						updateThumb(idx, papers.length);
					}
				});
			}, { root: feed, threshold: 0.6 });

			currentSlides.forEach(s => observer.observe(s));

			const swipeHint = document.getElementById('swipeHint');
			if (swipeHint) {
				feed.addEventListener('scroll', () => swipeHint.classList.add('hidden'), { once: true, passive: true });
			}
		}

		function populateGroupOptions(papers) {
			const counts = new Map();
			papers.forEach(p => counts.set(p.group, (counts.get(p.group) || 0) + 1));
			const groups = Array.from(counts.keys()).sort((a, b) => a.localeCompare(b));

			groupSelect.innerHTML = `<option value="">All groups (${papers.length})</option>` +
				groups.map(g => `<option value="${g}">${g} (${counts.get(g)})</option>`).join('');
		}

		// Refocusing the feed after using the group dropdown (a native
		// control, not something we can strip tabindex from) — same fix as
		// the progress track and theme toggle, since a hardware page-turn
		// button reportedly goes dead after using ANY of these until an
		// unrelated tap on the page. This is a pure focus-management change:
		// no CSS/touch/layout behavior touched, so if this alone still
		// breaks something, at least we'll know precisely what did it.
		function reclaimFeedFocus() {
			try { window.focus(); } catch (err) { /* ignore */ }
			feed.focus({ preventScroll: true });
		}

		groupSelect.addEventListener('change', () => {
			const value = groupSelect.value;
			const filtered = value ? ALL_PAPERS.filter(p => p.group === value) : ALL_PAPERS;
			renderFeed(filtered);
			reclaimFeedFocus();
		});
		groupSelect.addEventListener('blur', reclaimFeedFocus);

		// Keyboard support — for desktop testing, but also for e-reader/tablet
		// hardware page-turn buttons, many of which are wired to send plain
		// arrow-key events. Reads currentSlides fresh each time, so it stays
		// correct across group-filter re-renders. Accepts both the modern key
		// names and the legacy IE/old-WebView ones ("Up"/"Down"), since some
		// older e-reader browser engines still report those.
		const DOWN_KEYS = new Set(['ArrowDown', 'Down', 'PageDown']);
		const UP_KEYS = new Set(['ArrowUp', 'Up', 'PageUp']);
		window.addEventListener('keydown', (e) => {
			const isDown = DOWN_KEYS.has(e.key);
			const isUp = UP_KEYS.has(e.key);
			if (!isDown && !isUp) return;
			// Without this, the browser's own default scroll action for
			// these keys can target whatever scrollable element it thinks
			// is relevant — including a long abstract's own internal
			// scroll box — fighting with (or replacing) our slide-to-slide
			// jump instead of moving to the next/previous paper.
			e.preventDefault();
			const current = currentSlides.findIndex(s => {
				const r = s.getBoundingClientRect();
				return r.top >= -1 && r.top < window.innerHeight / 2;
			});
			const next = isDown ? current + 1 : current - 1;
			if (!currentSlides[next]) return;
			// A long abstract that's been scrolled down internally has a
			// non-zero scrollTop with overscroll-behavior: contain — with
			// #feed's CSS scroll-behavior: smooth still active, that combo
			// silently blocks scrollIntoView on a sibling slide in some
			// browsers until the abstract's own scroll resets to 0.
			// Resetting it here (rather than forcing an instant page jump)
			// keeps the normal smooth slide animation, and is reasonable UX
			// anyway — leaving with a paper starts it fresh at the top if
			// the reader swipes back to it later.
			const leavingAbstract = currentSlides[current] && currentSlides[current].querySelector('.abstract');
			if (leavingAbstract) leavingAbstract.scrollTop = 0;
			// A layout tick between resetting that scrollTop and requesting
			// the smooth scrollIntoView matters — doing both synchronously
			// back-to-back reproduced the same silent block this reset is
			// meant to avoid.
			requestAnimationFrame(() => {
				currentSlides[next].scrollIntoView({ behavior: 'smooth' });
			});
		});

		(async function bootstrap() {
			let papers = null;
			try {
				const loaded = await loadPapers();
				if (loaded.length) papers = loaded;
			} catch (err) {
				console.warn('papers.json fetch failed, using fallback papers:', err);
			}
			ALL_PAPERS = papers || FALLBACK_PAPERS;
			// Alphabetical by title, case/locale-aware. Sorted once here
			// rather than per-render: every group filter downstream is a
			// plain .filter() over this array (no re-sort of its own), so
			// sorting the source array once keeps both "All groups" and
			// every individual group alphabetical for free.
			//
			// JS's default collation sorts leading punctuation (", (, [)
			// before letters — technically "alphabetical" but not what a
			// person means by it, and this library has plenty of titles
			// starting with a quote, paren, or bracket (course-reading
			// PDFs, bracketed appendix titles, etc.). Strip any leading
			// run of non-alphanumeric characters before comparing so
			// '"Ideal Theory"...' sorts under I, not before every letter.
			const sortKey = (title) => (title || '').replace(/^[^\p{L}\p{N}]+/u, '');
			ALL_PAPERS.sort((a, b) => sortKey(a.title).localeCompare(sortKey(b.title), undefined, { sensitivity: 'base' }));
			loading.remove();
			populateGroupOptions(ALL_PAPERS);
			renderFeed(ALL_PAPERS);
			// Some embedded/e-reader browser engines don't deliver keydown
			// events to the page at all until something on it has been
			// explicitly focused — without this, a hardware up/down button
			// silently does nothing until the reader taps the screen once.
			reclaimFeedFocus();
		})();
	</script>
